<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>账户设置 - 个人理财管理系统</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="navbar">
    <div class="logo"><span>个</span><span>人</span><span>理</span><span>财</span></div>
    <ul class="nav-links">
      <li><a href="dashboard.html">仪表盘</a></li>
      <li><a href="statistics.html">统计分析</a></li>
      <li><a href="records.html">记账管理</a></li>
      <li><a href="budget.html">预算管理</a></li>
      <li><a href="categories.html">分类管理</a></li>
    </ul>
    <div class="user-info">
      <span>欢迎，<a href="account.html" id="username" class="username">--</a></span>
      <button type="button" class="btn-logout" id="logoutBtn">退出登录</button>
    </div>
  </nav>

  <main class="container">
    <section class="page-hero">
      <div>
        <p class="eyebrow">账户设置</p>
        <h1>管理您的个人信息</h1>
        <p class="page-subtitle">查看账户信息，修改密码，确保账户安全。</p>
      </div>
    </section>

    <div id="accountAlert" class="alert"></div>

    <section class="card account-section">
      <div class="card-header">
        <h2 class="card-title">基本信息</h2>
      </div>
      <div class="account-info">
        <div class="info-item">
          <span class="label">用户名</span>
          <span class="value" id="accountUsername">--</span>
        </div>
        <div class="info-item">
          <span class="label">注册时间</span>
          <span class="value" id="accountCreatedAt">--</span>
        </div>
      </div>
    </section>

    <section class="card account-section">
      <div class="card-header">
        <h2 class="card-title">修改密码</h2>
      </div>
      <form id="passwordForm">
        <div class="form-item">
          <label for="oldPassword">当前密码</label>
          <input type="password" id="oldPassword" placeholder="请输入当前密码" required>
        </div>
        <div class="form-item">
          <label for="newPassword">新密码</label>
          <input type="password" id="newPassword" placeholder="请输入新密码" required>
        </div>
        <div class="form-item">
          <label for="confirmPassword">确认新密码</label>
          <input type="password" id="confirmPassword" placeholder="请再次输入新密码" required>
        </div>
        <button type="submit" class="btn btn-primary" id="changePasswordBtn">修改密码</button>
      </form>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/axios@1.6.7/dist/axios.min.js"></script>
  <script src="js/axios-config.js"></script>
  <script src="js/toast.js"></script>
  <script src="js/account.js"></script>
</body>
</html>
