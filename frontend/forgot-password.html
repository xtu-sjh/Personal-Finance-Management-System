<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>忘记密码 - 个人理财管理系统</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="container">
  <div class="card login-box">
    <h2 class="title" style="text-align:center;">忘记密码</h2>
    <p style="text-align:center; color:var(--text-secondary); margin-bottom:var(--space-4);">请输入您的用户名，我们将帮助您重置密码。</p>
    <div id="alert" class="alert"></div>
    <form id="forgotPasswordForm">
      <div class="form-item">
        <label for="username">用户名</label>
        <input type="text" id="username" placeholder="请输入用户名" required>
      </div>
      <button type="submit" class="btn btn-primary btn-block" id="submitBtn">提交</button>
    </form>
    <div class="to-register">
      <a href="login.html">返回登录</a>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/axios@1.6.7/dist/axios.min.js"></script>
<script src="js/axios-config.js"></script>
<script src="js/toast.js"></script>
<script src="js/forgot-password.js"></script>
</body>
</html>
