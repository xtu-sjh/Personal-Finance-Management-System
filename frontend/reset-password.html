<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>重置密码 - 个人理财管理系统</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="container">
  <div class="card login-box">
    <h2 class="title" style="text-align:center;">重置密码</h2>
    <p style="text-align:center; color:var(--text-secondary); margin-bottom:var(--space-4);">请输入您的新密码。</p>
    <div id="alert" class="alert"></div>
    <form id="resetPasswordForm">
      <input type="hidden" id="token">
      <div class="form-item">
        <label for="newPassword">新密码</label>
        <input type="password" id="newPassword" placeholder="请输入新密码" required>
      </div>
      <div class="form-item">
        <label for="confirmPassword">确认新密码</label>
        <input type="password" id="confirmPassword" placeholder="请再次输入新密码" required>
      </div>
      <button type="submit" class="btn btn-primary btn-block" id="submitBtn">重置密码</button>
    </form>
    <div class="to-register">
      <a href="login.html">返回登录</a>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/axios@1.6.7/dist/axios.min.js"></script>
<script src="js/axios-config.js"></script>
<script src="js/toast.js"></script>
<script src="js/reset-password.js"></script>
</body>
</html>
