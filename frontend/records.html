<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>记账管理 - 个人理财管理系统</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="navbar">
    <div class="logo"><span>个</span><span>人</span><span>理</span><span>财</span></div>
    <ul class="nav-links">
      <li><a href="dashboard.html">仪表盘</a></li>
      <li><a href="statistics.html">统计分析</a></li>
      <li><a href="records.html" class="active">记账管理</a></li>
      <li><a href="budget.html">预算管理</a></li>
      <li><a href="categories.html">分类管理</a></li>
    </ul>
    <div class="user-info">
      <span>欢迎，<a href="account.html" id="username" class="username">--</a></span>
      <button type="button" class="btn-logout" id="logoutBtn">退出登录</button>
    </div>
  </nav>

  <main class="container">
    <section class="page-hero">
      <div>
        <p class="eyebrow">记账管理</p>
        <h1>记录每一笔收支</h1>
        <p class="page-subtitle">添加、编辑和删除收支记录，支持按分类和日期筛选。</p>
      </div>
      <div class="hero-actions">
        <button class="btn btn-primary" id="addRecordBtn">+ 添加记录</button>
      </div>
    </section>

    <div id="recordsAlert" class="alert"></div>

    <section class="card">
      <div class="toolbar">
        <div class="toolbar-group">
          <label class="toolbar-field" for="filterDate">日期</label>
          <input type="date" id="filterDate">
        </div>
        <div class="toolbar-group">
          <label class="toolbar-field" for="filterCategory">分类</label>
          <select id="filterCategory">
            <option value="">全部</option>
          </select>
        </div>
        <div class="toolbar-group">
          <label class="toolbar-field" for="filterType">类型</label>
          <select id="filterType">
            <option value="">全部</option>
            <option value="income">收入</option>
            <option value="expense">支出</option>
          </select>
        </div>
        <button class="btn btn-secondary" id="resetFilterBtn">重置</button>
      </div>
    </section>

    <section class="card">
      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th>日期</th>
              <th>分类</th>
              <th>金额</th>
              <th>类型</th>
              <th>备注</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody id="recordsList"></tbody>
        </table>
      </div>
      <div class="pagination" id="pagination"></div>
    </section>

    <!-- 添加/编辑记录弹窗 -->
    <div id="recordModal" style="display:none; position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,0.5); z-index:1000; display:none; align-items:center; justify-content:center;">
      <div class="card" style="width:100%; max-width:500px; margin:0;">
        <div class="card-header">
          <h2 class="card-title" id="modalTitle">添加记录</h2>
          <button class="btn btn-sm" id="closeModalBtn">✕</button>
        </div>
        <form id="recordForm">
          <input type="hidden" id="recordId">
          <div class="form-item">
            <label for="recordDate">日期</label>
            <input type="date" id="recordDate" required>
          </div>
          <div class="form-item">
            <label for="recordCategory">分类</label>
            <select id="recordCategory" required></select>
          </div>
          <div class="form-item">
            <label for="recordType">类型</label>
            <select id="recordType" required>
              <option value="expense">支出</option>
              <option value="income">收入</option>
            </select>
          </div>
          <div class="form-item">
            <label for="recordAmount">金额</label>
            <input type="number" id="recordAmount" step="0.01" min="0" placeholder="请输入金额" required>
          </div>
          <div class="form-item">
            <label for="recordNote">备注</label>
            <input type="text" id="recordNote" placeholder="请输入备注">
          </div>
          <button type="submit" class="btn btn-primary btn-block" id="saveRecordBtn">保存</button>
        </form>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/axios@1.6.7/dist/axios.min.js"></script>
  <script src="js/axios-config.js"></script>
  <script src="js/toast.js"></script>
  <script src="js/records.js"></script>
</body>
</html>
